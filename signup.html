<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Sign Up</title>
  </head>
  <body>
    <div class="form-container">
      <h2 class="form-title">Sign Up</h2>

      <form>
        <div class="form-input">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Type your name" />
        </div>
        <div class="form-input">
          <label for="email"> Email</label>
          <input type="email" id="email" placeholder="Type your email" />
        </div>
        <div class="form-input">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Type your password"
          />
        </div>
        <div class="form-input">
          <label for="birthdate">BirthDate</label>
          <input type="date" id="birthdate" placeholder="Type your birthdate" />
        </div>
        <div class="form-radios">
          <div class="male">
            <input type="radio" name="gender" id="male" value="male" />
            <label for="male">Male</label>
          </div>
          <div class="female">
            <input type="radio" name="gender" id="female" value="female" />
            <label for="female">Female</label>
          </div>
          <div class="other">
            <input type="radio" name="gender" id="other" value="female" />
            <label for="other">Other</label>
          </div>
        </div>

        <button class="btn btn-secondary" type="submit">Sign Up</button>
        <div class="already">
          <span>Already have an account? </span><a href="signin.html">Sign In 🦸 </a>
        </div>
      </form>
    </div>
  </body>
</html>
